<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>千问语音通话</title>
    <style>
      :root {
        --bg: #0c1116;
        --panel: #151d24;
        --panel-2: #1b2630;
        --line: #26333f;
        --text: #eef4f7;
        --muted: #93a5b1;
        --faint: #647684;
        --accent: #2fbf71;
        --accent-dark: #1f9d58;
        --danger: #e5484d;
        --danger-dark: #c93338;
        --warn: #f5b83d;
        --bubble-ai: #1b2630;
        --bubble-user: #14532d;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, select, input, textarea { font: inherit; color: inherit; }
      button, select, input:not([type="checkbox"]) { min-height: 44px; }

      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }

      /* ---------- 状态区 ---------- */
      .statusbar {
        padding: 18px 20px 10px;
        text-align: center;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: .02em;
      }
      .status-dot {
        width: 12px; height: 12px; border-radius: 50%;
        background: var(--faint);
        flex: none;
      }
      .status-pill[data-state="connecting"] .status-dot { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
      .status-pill[data-state="live"] .status-dot { background: var(--accent); animation: pulse 1.8s ease-in-out infinite; }
      .status-pill[data-state="speaking"] .status-dot { background: var(--accent); animation: pulse .7s ease-in-out infinite; }
      .status-pill[data-state="error"] .status-dot { background: var(--danger); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .status-dot { animation: none !important; } }
      .timer {
        margin-top: 4px;
        font-size: 15px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-height: 22px;
      }
      .ios-note {
        margin: 6px auto 0;
        max-width: 420px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--faint);
      }
      .error-box {
        display: none;
        margin: 10px 20px 0;
        padding: 10px 14px;
        background: rgba(229,72,77,.12);
        border: 1px solid rgba(229,72,77,.45);
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.55;
        color: #ffb4b8;
        text-align: left;
        word-break: break-word;
      }
      .error-box.show { display: block; }

      /* ---------- 字幕区 ---------- */
      .transcript {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        -webkit-overflow-scrolling: touch;
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--faint);
        font-size: 14px;
        line-height: 1.7;
        padding: 24px;
      }
      .msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 16px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
      .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
      .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 5px; }
      .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 5px; }
      .msg.user .who { color: #a7d7ba; }
      .msg.pending { opacity: .75; }

      /* ---------- 电平 ---------- */
      .level-row {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 22px 2px;
        font-size: 12px; color: var(--faint);
      }
      .level-track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
      .level-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width .08s linear; }
      .play-latency {
        padding: 3px 22px 0;
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        min-height: 18px;
      }

      /* ---------- 控制区 ---------- */
      .controls {
        padding: 12px 20px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .ctl-btn {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 999px;
        padding: 0 20px;
        min-height: 52px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .ctl-btn:disabled { opacity: .38; cursor: default; }
      .ctl-btn.active { background: #7a2d2f; border-color: #a03a3d; }
      .call-btn {
        border: none;
        border-radius: 999px;
        min-height: 64px;
        padding: 0 34px;
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        background: var(--accent-dark);
        cursor: pointer;
        display: inline-flex; align-items: center; gap: 10px;
      }
      .call-btn svg { flex: none; }
      .call-btn.hangup { background: var(--danger-dark); }
      .call-btn:disabled { opacity: .55; cursor: default; }

      /* ---------- 设置 ---------- */
      .settings {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 4px 20px 14px;
      }
      .settings summary {
        cursor: pointer;
        padding: 12px 0 6px;
        font-size: 15px;
        font-weight: 600;
        min-height: 44px;
        list-style: none;
        display: flex; align-items: center; gap: 8px;
      }
      .settings summary::-webkit-details-marker { display: none; }
      .settings summary .chev { color: var(--faint); font-size: 13px; }
      .field { margin-top: 12px; }
      .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
      .field input[type="password"], .field input[type="text"], .field select, .field textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 15px;
      }
      .field textarea { min-height: 64px; resize: vertical; line-height: 1.5; }
      .field .hint { font-size: 12px; color: var(--faint); margin-top: 5px; line-height: 1.5; }
      .key-row { display: flex; gap: 8px; }
      .key-row input { flex: 1; min-width: 0; }
      .key-row button {
        border: 1px solid var(--line); background: var(--panel-2);
        border-radius: 10px; padding: 0 14px; cursor: pointer; font-size: 14px;
      }
      .saved-tip { font-size: 12px; color: var(--accent); min-height: 18px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="statusbar">
        <div class="status-pill" id="statusPill" data-state="idle">
          <span class="status-dot"></span><span id="statusText">未连接</span>
        </div>
        <div class="timer" id="timer"></div>
        <p class="ios-note">通话中屏幕会保持常亮。iOS 锁屏后系统可能暂停麦克风采集（系统限制），回到页面即恢复。</p>
        <div class="error-box" id="errorBox" role="alert"></div>
      </div>

      <div class="transcript" id="transcript" aria-live="polite">
        <div class="empty" id="emptyState">还没有对话。<br />在下方设置里填好 Key，点「开始通话」后直接说话即可。</div>
      </div>

      <div class="level-row" aria-hidden="true">
        <span>麦克风</span>
        <div class="level-track"><div class="level-fill" id="levelFill"></div></div>
      </div>
      <div class="play-latency" id="playLatency">播放延迟：—（收到首个语音包后显示）</div>

      <div class="controls">
        <button class="ctl-btn" id="muteBtn" disabled>静音</button>
        <button class="call-btn" id="callBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.4 11.4 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
          <span id="callBtnText">开始通话</span>
        </button>
        <button class="ctl-btn" id="interruptBtn" disabled>打断</button>
      </div>

      <details class="settings" id="settingsPanel">
        <summary>设置 <span class="chev">展开 / 收起</span></summary>

        <div class="field">
          <label for="keyInput">Token Plan API Key</label>
          <div class="key-row">
            <input type="password" id="keyInput" placeholder="sk-sp- 开头的 Key" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button type="button" id="toggleKeyBtn">显示</button>
          </div>
          <p class="hint">只保存在这台设备的浏览器本地，不经过任何服务器；连接时直接带给千问。</p>
        </div>

        <div class="field">
          <label for="voiceInput">音色（voice）</label>
          <input type="text" id="voiceInput" value="longanqian" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>

        <div class="field">
          <label for="turnSelect">轮次检测模式</label>
          <select id="turnSelect">
            <option value="server_vad">server_vad（服务端语音检测）</option>
            <option value="smart_turn_v2">smart_turn_v2（智能轮次）</option>
          </select>
        </div>

        <div class="field">
          <label for="instructionsInput">指令（instructions）</label>
          <textarea id="instructionsInput">你是语音助手，回答简洁自然。</textarea>
        </div>

        <div class="saved-tip" id="savedTip"></div>
      </details>
    </div>

    <script>
      (function () {
        "use strict";

        var MODEL = "qwen-audio-3.0-realtime-plus";
        var WS_BASE = "wss://token-plan.maas.qianwenaiapi.com/api-ws/v1/realtime";
        var LS = { key: "qw_voice_key", voice: "qw_voice_voice", inst: "qw_voice_instructions", turn: "qw_voice_turn" };

        var $ = function (id) { return document.getElementById(id); };
        var statusPill = $("statusPill"), statusText = $("statusText"), timerEl = $("timer"),
            errorBox = $("errorBox"), transcriptEl = $("transcript"), emptyState = $("emptyState"),
            levelFill = $("levelFill"), playLatencyEl = $("playLatency"), callBtn = $("callBtn"), callBtnText = $("callBtnText"),
            muteBtn = $("muteBtn"), interruptBtn = $("interruptBtn"),
            keyInput = $("keyInput"), voiceInput = $("voiceInput"),
            turnSelect = $("turnSelect"), instructionsInput = $("instructionsInput"),
            savedTip = $("savedTip"), settingsPanel = $("settingsPanel");

        /* ---------- 设置持久化（仅本机浏览器） ---------- */
        try {
          keyInput.value = localStorage.getItem(LS.key) || "";
          voiceInput.value = localStorage.getItem(LS.voice) || "longanqian";
          instructionsInput.value = localStorage.getItem(LS.inst) || "你是语音助手，回答简洁自然。";
          turnSelect.value = localStorage.getItem(LS.turn) || "server_vad";
        } catch (e) { /* 存储不可用时用默认值 */ }

        var saveTimer = null;
        function saveSettings() {
          try {
            localStorage.setItem(LS.key, keyInput.value.trim());
            localStorage.setItem(LS.voice, voiceInput.value.trim() || "longanqian");
            localStorage.setItem(LS.inst, instructionsInput.value);
            localStorage.setItem(LS.turn, turnSelect.value);
          } catch (e) {}
          savedTip.textContent = "设置已保存在本机浏览器";
          clearTimeout(saveTimer);
          saveTimer = setTimeout(function () { savedTip.textContent = ""; }, 2000);
        }
        [keyInput, voiceInput, instructionsInput].forEach(function (el) { el.addEventListener("input", saveSettings); });
        turnSelect.addEventListener("change", saveSettings);

        $("toggleKeyBtn").addEventListener("click", function () {
          var show = keyInput.type === "password";
          keyInput.type = show ? "text" : "password";
          this.textContent = show ? "隐藏" : "显示";
        });
        if (!keyInput.value) settingsPanel.open = true;

        /* ---------- 状态 ---------- */
        var state = "idle"; // idle | connecting | live | speaking | error
        function setStatus(s, label) {
          state = s;
          statusPill.setAttribute("data-state", s);
          statusText.textContent = label;
        }
        function showError(msg) {
          errorBox.textContent = msg;
          errorBox.classList.add("show");
        }
        function clearError() { errorBox.classList.remove("show"); errorBox.textContent = ""; }

        /* ---------- 通话计时 ---------- */
        var timerInt = null, callStartAt = 0;
        function fmtTime(sec) {
          var m = Math.floor(sec / 60), s = sec % 60;
          return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }
        function startTimer() {
          callStartAt = Date.now();
          timerEl.textContent = "通话时长 00:00";
          timerInt = setInterval(function () {
            timerEl.textContent = "通话时长 " + fmtTime(Math.floor((Date.now() - callStartAt) / 1000));
          }, 500);
        }
        function stopTimer() { clearInterval(timerInt); timerInt = null; }

        /* ---------- 字幕气泡 ---------- */
        function scrollTranscript() { transcriptEl.scrollTop = transcriptEl.scrollHeight; }
        function addBubble(who) {
          if (emptyState) { emptyState.remove(); emptyState = null; }
          var div = document.createElement("div");
          div.className = "msg " + who + " pending";
          var label = document.createElement("span");
          label.className = "who";
          label.textContent = who === "user" ? "我" : "千问";
          var body = document.createElement("span");
          div.appendChild(label); div.appendChild(body);
          transcriptEl.appendChild(div);
          scrollTranscript();
          return { el: div, body: body, text: "" };
        }
        var userBubble = null, aiBubble = null;

        /* ---------- 音频：播放与采集共用一个 AudioContext ----------
           上一版给播放、麦克风各建一个上下文，并强行指定 24kHz / 16kHz 采样率：
           iOS 只有一套硬件音频通道，两个不同采样率的上下文并存时，系统被迫走
           软件重采样并加大缓冲，结果反而更慢。本版全程只用一个默认采样率的
           上下文：播放的 PCM 按源采样率（24kHz）建缓冲、由播放引擎在输出时
           重采样；采集样本在发送前线性重采样到 16kHz。
           播放调度：每个 response.audio.delta 一到就解码排队，不攒段、不等
           response.done；每轮首包留 LEAD 秒抖动缓冲，后续段紧贴上一段末尾
           无缝衔接，时间线落后时只贴现重排、不补整段缓冲（见 playPcmChunk）。 */
        var LEAD = 0.05; // 50ms 抖动缓冲，仅用于每轮回复的第一个音频包
        var audioCtx = null, nextStartTime = 0, playSources = [];
        var awaitingFirstAudio = false; // 本轮回复是否还在等首个音频包（用于延迟自检）
        function ensureAudioCtx() {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            try { audioCtx = new AC({ latencyHint: "interactive" }); }
            catch (e) { audioCtx = new AC(); }
            nextStartTime = 0;
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        }
        function base64ToInt16(b64) {
          var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
          for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
          return new Int16Array(bytes.buffer, 0, Math.floor(len / 2));
        }
        function playPcmChunk(b64, receivedAt) {
          if (!b64) return;
          var receiptPerf = (typeof receivedAt === "number") ? receivedAt : performance.now();
          var ctx = ensureAudioCtx();
          var pcm = base64ToInt16(b64);
          if (!pcm.length) return;
          // 缓冲按源采样率 24kHz 创建：与上下文采样率不一致时，由浏览器播放引擎在
          // 输出时做硬件/高效重采样，不逐段建 OfflineAudioContext、也不做整段合并。
          var buf = ctx.createBuffer(1, pcm.length, 24000);
          var ch = buf.getChannelData(0);
          for (var i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          var now = ctx.currentTime;
          // 排队衔接：正常时紧贴上一段末尾无缝排队。时间线已落后（欠载）时：
          // 本轮首包用 LEAD 留抖动缓冲；其余段只留 12ms 贴现重排——上一版每段
          // 欠载都补 50ms，段间被反复塞进等量静音，语音越播越拖、越落后于字幕。
          var lead = awaitingFirstAudio ? LEAD : 0.012;
          if (!nextStartTime || nextStartTime < now) nextStartTime = now + lead;
          var startAt = Math.max(now + lead, nextStartTime);
          src.start(startAt);
          nextStartTime = startAt + buf.duration;
          playSources.push(src);
          src.onended = function () {
            var idx = playSources.indexOf(src);
            if (idx >= 0) playSources.splice(idx, 1);
          };
          // 延迟自检：本轮首个音频包从收包到排定开播的耗时（含解码 + LEAD 抖动缓冲）
          if (awaitingFirstAudio) {
            awaitingFirstAudio = false;
            var ms = Math.max(1, Math.round((performance.now() - receiptPerf) + (startAt - ctx.currentTime) * 1000));
            if (playLatencyEl) playLatencyEl.textContent = "播放延迟：" + ms + " ms（首个语音包到开始播放）";
          }
        }
        function stopPlayback() {
          // 打断/挂断：立即停掉所有已排队的 BufferSource，并把时间线彻底重置，
          // 下一段音频重新从 currentTime + LEAD 起排，不继承任何旧排队。
          playSources.slice().forEach(function (s) { try { s.stop(); } catch (e) {} try { s.disconnect(); } catch (e) {} });
          playSources = [];
          nextStartTime = 0;
          awaitingFirstAudio = false;
        }

        /* ---------- 音频：麦克风采集（16kHz PCM） ----------
           采样率铁律：下采样比只能用运行时读回的真实采样率计算，禁止写死、
           禁止用构造时请求的数值。iOS Safari 会忽略构造参数里的 sampleRate
           （请求 16000、实际仍按 48000 采集）；上一版正是按请求值算比，
           48kHz 的流被当 16kHz 发出，服务端收到的语音被拉长约 3 倍，
           说完一句话要多等好几秒才断句回复（实测约 5 秒）。 */
        var micStream = null, micNode = null, micSource = null;
        var micRate = 0; // startMic 时从 audioCtx.sampleRate 读回的真实采集率
        var rsPos = 0; // 重采样相位（源样本坐标，跨回调保留，避免逐块丢尾样本）
        var muted = false;
        var sendBuffer = []; // Float32 样本（已重采样到 16kHz，计数按重采样后的点数）
        var SEND_SAMPLES = 800; // 目标 16kHz 下 800 点 = 50ms 一发

        function floatTo16BitPcmBase64(samples) {
          var buf = new ArrayBuffer(samples.length * 2);
          var view = new DataView(buf);
          for (var i = 0; i < samples.length; i++) {
            var s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          }
          var bytes = new Uint8Array(buf), bin = "";
          var CH = 8192;
          for (var j = 0; j < bytes.length; j += CH) {
            bin += String.fromCharCode.apply(null, bytes.subarray(j, j + CH));
          }
          return btoa(bin);
        }

        var lastLevelAt = 0;
        function updateLevel(samples) {
          // 电平条最多每 100ms 刷新一次：采集回调每几毫秒就来一次，每次都写
          // DOM 样式会占满主线程，拖慢 WebSocket 语音包的解码与排队。
          var nowMs = performance.now();
          if (nowMs - lastLevelAt < 100) return;
          lastLevelAt = nowMs;
          var sum = 0;
          for (var i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
          var rms = Math.sqrt(sum / Math.max(1, samples.length));
          levelFill.style.width = Math.min(100, Math.round(rms * 260)) + "%";
        }

        function handleMicSamples(float32, srcRate) {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          updateLevel(float32);
          if (muted) return;
          // srcRate 必须是真实采集率（上下文读回值或 Worklet 自报值）；
          // 拿不到时退回 startMic 记录的 micRate，绝不用请求值/写死值算比。
          var rate = srcRate || micRate;
          if (!rate) return;
          // 线性重采样到 16kHz：步长 = 真实率 / 16000，相位跨回调保留，
          // 保证长期平均速率精确、不逐块丢样本。
          var ratio = rate / 16000;
          var pos = rsPos;
          while (pos < float32.length) {
            sendBuffer.push(float32[Math.floor(pos)]);
            pos += ratio;
          }
          rsPos = pos - float32.length;
          // sendBuffer 里是重采样后的 16kHz 点数，满 800 点（50ms）即发
          while (sendBuffer.length >= SEND_SAMPLES) {
            var chunk = sendBuffer.splice(0, SEND_SAMPLES);
            ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: floatTo16BitPcmBase64(chunk) }));
          }
        }

        function startMic(stream) {
          // 与播放共用同一个上下文，且不向构造器请求任何采样率（请求了 iOS
          // 也多半忽略、只会误导后续计算）；真实采集率从 sampleRate 读回。
          var ctx = ensureAudioCtx();
          micRate = ctx.sampleRate || 48000;
          rsPos = 0;
          micSource = ctx.createMediaStreamSource(stream);

          function useScriptProcessor() {
            // 兜底路径：缓冲 1024 帧；采样率口径与主路径一致，用读回的 micRate
            micNode = ctx.createScriptProcessor(1024, 1, 1);
            micNode.onaudioprocess = function (e) {
              handleMicSamples(e.inputBuffer.getChannelData(0).slice(0), micRate);
            };
            micSource.connect(micNode);
            micNode.connect(ctx.destination);
          }

          if (ctx.audioWorklet && typeof AudioWorkletNode !== "undefined") {
            // Worklet 内部攒满 512 帧再 postMessage（原来每 128 帧一发、约
            // 375 次/秒，消息风暴挤占主线程）；每条消息自带处理器全局的真实
            // sampleRate，主线程以它为准算下采样比，与兜底路径口径一致。
            var code = "class MicProc extends AudioWorkletProcessor{" +
              "constructor(){super();this.buf=new Float32Array(512);this.n=0;}" +
              "process(inputs){var ch=inputs[0]&&inputs[0][0];if(ch){for(var i=0;i<ch.length;i++){this.buf[this.n++]=ch[i];if(this.n===512){this.port.postMessage({rate:sampleRate,data:this.buf.slice(0)});this.n=0;}}}return true;}}" +
              "registerProcessor('mic-proc',MicProc);";
            var blobUrl = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
            ctx.audioWorklet.addModule(blobUrl).then(function () {
              URL.revokeObjectURL(blobUrl);
              micNode = new AudioWorkletNode(ctx, "mic-proc");
              micNode.port.onmessage = function (ev) { handleMicSamples(ev.data.data, ev.data.rate); };
              micSource.connect(micNode);
            }).catch(function () {
              URL.revokeObjectURL(blobUrl);
              useScriptProcessor();
            });
          } else {
            useScriptProcessor();
          }
        }

        function stopMic() {
          if (micNode) { try { micNode.disconnect(); } catch (e) {} micNode = null; }
          if (micSource) { try { micSource.disconnect(); } catch (e) {} micSource = null; }
          // 共享上下文不在这里关：播放侧还在用，由 cleanupCall 统一关闭
          if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
          sendBuffer = [];
          rsPos = 0;
          levelFill.style.width = "0%";
        }

        /* ---------- Wake Lock / Media Session ---------- */
        var wakeLock = null;
        function requestWakeLock() {
          if (!("wakeLock" in navigator)) return;
          navigator.wakeLock.request("screen").then(function (lock) { wakeLock = lock; }).catch(function () {});
        }
        function releaseWakeLock() {
          if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
        }
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && (state === "live" || state === "speaking")) requestWakeLock();
        });
        function setupMediaSession() {
          if (!("mediaSession" in navigator)) return;
          try {
            navigator.mediaSession.metadata = new MediaMetadata({ title: "千问语音通话", artist: "qwen-audio-3.0-realtime-plus" });
            navigator.mediaSession.setActionHandler("hangup", function () { endCall(); });
          } catch (e) {}
          try { navigator.mediaSession.setActionHandler("pause", function () { endCall(); }); } catch (e) {}
        }
        function clearMediaSession() {
          if (!("mediaSession" in navigator)) return;
          try {
            navigator.mediaSession.metadata = null;
            navigator.mediaSession.setActionHandler("hangup", null);
            navigator.mediaSession.setActionHandler("pause", null);
          } catch (e) {}
        }

        /* ---------- WebSocket 通话 ---------- */
        var ws = null, sessionReady = false, gotSessionCreated = false;

        function setControls() {
          var inCall = state === "connecting" || state === "live" || state === "speaking";
          callBtnText.textContent = inCall ? "结束通话" : "开始通话";
          callBtn.classList.toggle("hangup", inCall);
          muteBtn.disabled = !(state === "live" || state === "speaking");
          interruptBtn.disabled = state !== "speaking";
        }

        function sendSessionUpdate() {
          var turnType = turnSelect.value;
          var turn = turnType === "smart_turn_v2"
            ? { type: "smart_turn_v2" }
            : { type: "server_vad", threshold: 0.5, silence_duration_ms: 500 };
          ws.send(JSON.stringify({
            type: "session.update",
            session: {
              modalities: ["audio", "text"],
              voice: voiceInput.value.trim() || "longanqian",
              instructions: instructionsInput.value || "你是语音助手，回答简洁自然。",
              input_audio_format: "pcm",
              output_audio_format: "pcm",
              turn_detection: turn
            }
          }));
        }

        function startCall() {
          clearError();
          var key = keyInput.value.trim();
          if (!key) {
            settingsPanel.open = true;
            showError("请先在下方设置里填入 Token Plan 的 API Key（sk-sp- 开头），再开始通话。");
            keyInput.focus();
            return;
          }
          saveSettings();
          // 在点击手势里就创建并 resume 播放上下文，避免首个音频包到达时
          // 还要等上下文唤醒（那一段等待正是「文字先出、声音慢半拍」的一部分）。
          ensureAudioCtx();
          setStatus("connecting", "连接中…");
          setControls();

          var url = WS_BASE + "?model=" + encodeURIComponent(MODEL) + "&api_key=" + encodeURIComponent(key);
          gotSessionCreated = false;
          sessionReady = false;
          try {
            ws = new WebSocket(url);
          } catch (e) {
            onConnectFail("无法创建连接：" + e.message);
            return;
          }

          ws.onopen = function () {
            // 等服务端 session.created 后再发 session.update 并开麦
          };
          ws.onmessage = function (ev) {
            var msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            handleServerEvent(msg);
          };
          ws.onerror = function () {
            if (!gotSessionCreated) {
              onConnectFail("连接失败：握手没成功。请检查 Key 是否为 Token Plan 的 sk-sp- 开头 Key、网络是否正常，然后重试。");
            } else {
              showError("连接出现错误，通话已断开。");
              cleanupCall();
              setStatus("idle", "未连接");
              setControls();
            }
          };
          ws.onclose = function () {
            if (state === "connecting" && !gotSessionCreated) {
              onConnectFail("连接被关闭：握手没成功。请检查 Key 是否为 Token Plan 的 sk-sp- 开头 Key，然后重试。");
              return;
            }
            if (state === "live" || state === "speaking" || state === "connecting") {
              cleanupCall();
              setStatus("idle", "未连接");
              setControls();
              timerEl.textContent = timerEl.textContent ? timerEl.textContent + "（已结束）" : "";
            }
          };

          // 麦克风在 session.created 后开启；先申请权限避免打断握手提示
          navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
            .then(function (stream) {
              micStream = stream;
              if (sessionReady) startMic(stream);
            })
            .catch(function (err) {
              showError("麦克风不可用：" + (err && err.name === "NotAllowedError" ? "权限被拒绝，请在浏览器设置里允许麦克风后重试。" : (err && err.message) || err));
              endCall();
            });
        }

        function onConnectFail(msg) {
          cleanupCall();
          setStatus("error", "连接失败");
          showError(msg);
          setControls();
        }

        function handleServerEvent(msg) {
          switch (msg.type) {
            case "session.created":
              gotSessionCreated = true;
              sendSessionUpdate();
              break;
            case "session.updated":
              if (!sessionReady) {
                sessionReady = true;
                setStatus("live", "通话中");
                startTimer();
                requestWakeLock();
                setupMediaSession();
                ensureAudioCtx();
                if (micStream) startMic(micStream);
                setControls();
              }
              break;
            case "input_audio_buffer.speech_started":
              break;
            case "conversation.item.input_audio_transcription.delta": {
              var d = msg.delta || "";
              if (d) {
                if (!userBubble) userBubble = addBubble("user");
                userBubble.text += d;
                userBubble.body.textContent = userBubble.text;
                scrollTranscript();
              }
              break;
            }
            case "conversation.item.input_audio_transcription.completed": {
              var t = msg.transcript || "";
              if (t || userBubble) {
                if (!userBubble) userBubble = addBubble("user");
                if (t) { userBubble.text = t; userBubble.body.textContent = t; }
                userBubble.el.classList.remove("pending");
                userBubble = null;
                scrollTranscript();
              }
              break;
            }
            case "response.created":
              setStatus("speaking", "对方说话中");
              interruptBtn.disabled = false;
              awaitingFirstAudio = true; // 本轮延迟自检从首个音频包开始计
              break;
            case "response.audio.delta":
              // 首包立即解码排队开播，不攒段、不等 response.done
              playPcmChunk(msg.delta, performance.now());
              break;
            case "response.audio_transcript.delta": {
              var ad = msg.delta || "";
              if (ad) {
                if (!aiBubble) aiBubble = addBubble("ai");
                aiBubble.text += ad;
                aiBubble.body.textContent = aiBubble.text;
                scrollTranscript();
              }
              break;
            }
            case "response.audio_transcript.done": {
              var at = msg.transcript || "";
              if (at || aiBubble) {
                if (!aiBubble) aiBubble = addBubble("ai");
                if (at) { aiBubble.text = at; aiBubble.body.textContent = at; }
                aiBubble.el.classList.remove("pending");
                aiBubble = null;
                scrollTranscript();
              }
              break;
            }
            case "response.done":
              awaitingFirstAudio = false;
              if (aiBubble) { aiBubble.el.classList.remove("pending"); aiBubble = null; }
              if (state === "speaking") { setStatus("live", "通话中"); }
              interruptBtn.disabled = true;
              break;
            case "error": {
              var em = (msg.error && (msg.error.message || msg.error.code)) || "服务端返回未知错误";
              showError("千问返回错误：" + em);
              break;
            }
            default:
              break;
          }
        }

        function cleanupCall() {
          stopTimer();
          stopMic();
          stopPlayback();
          if (audioCtx) { var ac = audioCtx; audioCtx = null; ac.close().catch(function () {}); }
          releaseWakeLock();
          clearMediaSession();
          if (ws) {
            var sock = ws; ws = null;
            try { sock.onclose = null; sock.onerror = null; sock.onmessage = null; sock.close(); } catch (e) {}
          }
          sessionReady = false;
          userBubble = null; aiBubble = null;
          muted = false;
          muteBtn.textContent = "静音";
          muteBtn.classList.remove("active");
        }

        function endCall() {
          cleanupCall();
          setStatus("idle", "未连接");
          setControls();
        }

        callBtn.addEventListener("click", function () {
          if (state === "idle" || state === "error") startCall();
          else endCall();
        });

        muteBtn.addEventListener("click", function () {
          muted = !muted;
          muteBtn.textContent = muted ? "取消静音" : "静音";
          muteBtn.classList.toggle("active", muted);
          if (muted) levelFill.style.width = "0%";
        });

        interruptBtn.addEventListener("click", function () {
          stopPlayback();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "response.cancel" }));
          }
          if (aiBubble) { aiBubble.el.classList.remove("pending"); aiBubble = null; }
          if (state === "speaking") setStatus("live", "通话中");
          interruptBtn.disabled = true;
        });

        setControls();
      })();
    </script>
  </body>
</html>
